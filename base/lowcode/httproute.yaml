apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nodered
spec:
  parentRefs:
  - name: processcube-gateway
    sectionName: websecure-nodered
  hostnames:
  - nodered.dev.5minds.cloud
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: nodered
      port: 30000
