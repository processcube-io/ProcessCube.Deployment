apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authority
spec:
  parentRefs:
  - name: processcube-gateway
    sectionName: websecure-authority
  hostnames:
  - authority.dev.5minds.cloud
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: authority
      port: 11560
