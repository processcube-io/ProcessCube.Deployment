apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: engine
spec:
  parentRefs:
  - name: processcube-gateway
    sectionName: websecure-engine
  hostnames:
  - engine.dev.5minds.cloud
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: engine
      port: 10560
