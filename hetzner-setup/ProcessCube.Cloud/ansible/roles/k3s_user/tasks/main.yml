---
- name: Create required directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/rancher/k3s
    - /var/lib/rancher/k3s
    - /var/log/k3s

- name: Load required kernel modules
  shell: modprobe {{ item }}
  loop:
    - br_netfilter
    - overlay
  changed_when: false

- name: Ensure kernel modules are loaded on boot
  copy:
    content: |
      br_netfilter
      overlay
    dest: /etc/modules-load.d/k3s.conf
    owner: root
    group: root
    mode: '0644'

- name: Configure sysctl for k3s
  copy:
    content: |
      net.ipv4.ip_forward = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
    dest: /etc/sysctl.d/99-k3s.conf

- name: Apply sysctl settings
  shell: sysctl --system
  changed_when: false
