---
- name: Install required packages
  apt:
    name:
      - curl
      - wget
      - ufw
      - netcat-openbsd
    state: present
    update_cache: yes

- name: Disable swap
  shell: |
    swapoff -a
    sed -i '/ swap / s/^/#/' /etc/fstab
  changed_when: false

- name: Configure firewall rules
  shell: |
    ufw allow 22/tcp
    ufw allow 80/tcp
    ufw allow 443/tcp
    ufw allow from 10.0.0.0/16 to any port 10250 proto tcp
    ufw allow from 10.0.0.0/16
    ufw allow from 10.42.0.0/16
    ufw allow from 10.43.0.0/16
    ufw default deny incoming
    ufw --force enable

- name: Wait for master node to be ready
  wait_for:
    host: "{{ master_ip }}"
    port: 6443
    timeout: 300

- name: Check if K3s is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Download K3s installation script
  get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s_install.sh
    mode: '0700'
  when: not k3s_binary.stat.exists
  retries: 5
  delay: 10
  register: k3s_script_download
  until: k3s_script_download is success

- name: Get private IP from private network interface
  shell: ip -4 addr show enp7s0 | grep -oP '(?<=inet\s)\d+(\.\d+){3}'
  register: worker_private_ip
  changed_when: false

- name: Get hostname for node name
  shell: hostname
  register: node_hostname
  changed_when: false

- name: Display installation parameters
  debug:
    msg:
      - "Installing K3s worker with:"
      - "  Channel: stable (latest)"
      - "  Master IP: {{ master_ip }}"
      - "  Node IP: {{ worker_private_ip.stdout }}"
      - "  Node Name: {{ node_hostname.stdout }}"

- name: Install K3s worker
  shell: |
    INSTALL_K3S_CHANNEL=stable \
    K3S_URL=https://{{ master_ip }}:6443 \
    K3S_TOKEN="{{ k3s_join_token }}" \
    INSTALL_K3S_EXEC="--node-ip {{ worker_private_ip.stdout }} --flannel-iface=enp7s0 --kubelet-arg cloud-provider=external" \
    /tmp/k3s_install.sh
  args:
    creates: /usr/local/bin/k3s
  when: not k3s_binary.stat.exists
  register: k3s_install_output
  async: 300
  poll: 10

- name: Verify K3s was installed successfully
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary_check

- name: Fail if K3s installation failed
  fail:
    msg: "K3s installation failed. Check /tmp/k3s-install.log on the worker node."
  when: not k3s_binary_check.stat.exists

- name: Display K3s installation output
  debug:
    msg: "{{ k3s_install_output.stdout_lines }}"
  when: k3s_install_output is defined and k3s_install_output.stdout_lines is defined

- name: Enable and start K3s agent service
  systemd:
    name: k3s-agent
    enabled: yes
    state: started
    daemon_reload: yes
  register: agent_service_start
  ignore_errors: true

- name: Wait for K3s agent to become active
  shell: systemctl is-active k3s-agent
  register: agent_active
  until: agent_active.stdout == "active"
  retries: 18
  delay: 10
  changed_when: false
  ignore_errors: true

- name: Collect k3s-agent logs if not active
  shell: journalctl -xeu k3s-agent --no-pager -n 50
  register: agent_logs
  changed_when: false
  ignore_errors: true
  when: agent_active.stdout != "active"

- name: Show k3s-agent logs on failure
  debug:
    msg: "{{ agent_logs.stdout_lines }}"
  when: agent_active.stdout != "active"

- name: Fail if K3s agent is not active
  fail:
    msg: "K3s agent service failed to start. Check logs above."
  when: agent_active.stdout != "active"

- name: Display K3s worker installation info
  debug:
    msg: "K3s worker node joined the cluster successfully."
