---
- name: Wait for all nodes to be initialized by CCM
  shell: |
    for node in $(kubectl get nodes -o jsonpath='{.items[*].metadata.name}'); do
      providerid=$(kubectl get node $node -o jsonpath='{.spec.providerID}')
      if [[ -z "$providerid" || ! "$providerid" =~ ^hcloud:// ]]; then
        exit 1
      fi
    done
    exit 0
  args:
    executable: /bin/bash
  register: providerid_check
  until: providerid_check.rc == 0
  retries: 60
  delay: 5
  changed_when: false

- name: Download Hetzner CSI Driver manifest
  get_url:
    url: https://raw.githubusercontent.com/hetznercloud/csi-driver/{{ hcloud_csi_version }}/deploy/kubernetes/hcloud-csi.yml
    dest: /tmp/hcloud-csi.yml
    mode: '0644'

- name: Install Hetzner CSI Driver
  shell: kubectl apply -f /tmp/hcloud-csi.yml
  register: csi_install
  changed_when: "'created' in csi_install.stdout or 'configured' in csi_install.stdout"

- name: Wait for CSI Driver to be ready
  shell: kubectl get pods -n kube-system -l app.kubernetes.io/name=hcloud-csi -o jsonpath='{.items[*].status.phase}'
  register: csi_status
  until: "'Running' in csi_status.stdout"
  retries: 30
  delay: 10
  changed_when: false

- name: Label all nodes for LoadBalancer targeting
  shell: kubectl label nodes --all loadbalancer-target=true --overwrite
  changed_when: true

- name: Install Gateway API CRDs
  shell: kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.0/standard-install.yaml
  register: gateway_api_install
  changed_when: "'created' in gateway_api_install.stdout or 'configured' in gateway_api_install.stdout"

- name: Wait for Gateway API CRDs to be established
  shell: kubectl wait --for=condition=Established crd/gateways.gateway.networking.k8s.io --timeout=60s
  register: gateway_crd_wait
  until: gateway_crd_wait.rc == 0
  retries: 12
  delay: 5
  changed_when: false

- name: Add Traefik Helm repository
  shell: helm repo add traefik https://traefik.github.io/charts && helm repo update
  changed_when: false

- name: Create traefik namespace
  shell: kubectl create namespace traefik --dry-run=client -o yaml | kubectl apply -f -
  changed_when: true

- name: Write Traefik v3 Helm values
  copy:
    dest: /tmp/traefik-values.yaml
    mode: '0644'
    content: |
      deployment:
        kind: DaemonSet
        dnsPolicy: ClusterFirstWithHostNet

      hostNetwork: true

      ports:
        web:
          port: 80
          exposedPort: 80
        websecure:
          port: 443
          exposedPort: 443

      service:
        type: LoadBalancer

      providers:
        kubernetesGateway:
          enabled: true
        kubernetesIngress:
          enabled: false

      gatewayClass:
        enabled: true
        name: traefik

      rbac:
        enabled: true

- name: Install Traefik v3 with Gateway API support
  shell: |
    helm upgrade --install traefik traefik/traefik \
      --namespace traefik \
      --version 39.0.7 \
      --values /tmp/traefik-values.yaml \
      --wait \
      --timeout 5m
  register: traefik_install
  changed_when: true

- name: Wait for Traefik DaemonSet to be ready on all nodes
  shell: |
    node_count=$(kubectl get nodes --no-headers | wc -l)
    ready_count=$(kubectl get pods -n traefik -l app.kubernetes.io/name=traefik --field-selector=status.phase=Running --no-headers 2>/dev/null | wc -l)
    if [ "$ready_count" -eq "$node_count" ]; then
      exit 0
    else
      exit 1
    fi
  args:
    executable: /bin/bash
  register: traefik_status
  until: traefik_status.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Annotate Traefik Service for Hetzner LoadBalancer
  shell: |
    kubectl annotate service traefik \
      -n traefik \
      load-balancer.hetzner.cloud/location="{{ location }}" \
      load-balancer.hetzner.cloud/use-private-ip="true" \
      load-balancer.hetzner.cloud/uses-proxyprotocol="false" \
      load-balancer.hetzner.cloud/name="{{ cluster_name }}-lb" \
      load-balancer.hetzner.cloud/node-selector="loadbalancer-target=true" \
      load-balancer.hetzner.cloud/health-check-interval="10s" \
      load-balancer.hetzner.cloud/health-check-timeout="5s" \
      load-balancer.hetzner.cloud/health-check-retries="3" \
      --overwrite
  changed_when: true

- name: Wait a moment for LoadBalancer to start provisioning
  pause:
    seconds: 15

- name: Wait for LoadBalancer to be provisioned
  shell: kubectl get svc traefik -n traefik -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
  register: lb_ip
  until: lb_ip.stdout != ""
  retries: 60
  delay: 10
  changed_when: false

- name: Display LoadBalancer IP
  debug:
    msg: "LoadBalancer IP: {{ lb_ip.stdout }}"

- name: Install cert-manager
  shell: |
    kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.20.2/cert-manager.yaml
  register: certmanager_install
  changed_when: "'created' in certmanager_install.stdout or 'configured' in certmanager_install.stdout"

- name: Wait for cert-manager to be ready
  shell: kubectl get pods -n cert-manager -o jsonpath='{.items[*].status.phase}'
  register: certmanager_status
  until: certmanager_status.stdout.find('Running') != -1 and (certmanager_status.stdout | regex_findall('Running') | length) >= 3
  retries: 30
  delay: 10
  changed_when: false

- name: Wait for cert-manager webhook to be ready
  shell: kubectl get deployment -n cert-manager cert-manager-webhook -o jsonpath='{.status.availableReplicas}'
  register: webhook_status
  until: webhook_status.stdout | int > 0
  retries: 30
  delay: 10
  changed_when: false

- name: Wait for cert-manager webhook endpoint to be ready
  shell: kubectl get endpoints -n cert-manager cert-manager-webhook -o jsonpath='{.subsets[*].addresses[*].ip}'
  register: webhook_endpoint
  until: webhook_endpoint.stdout != ""
  retries: 30
  delay: 10
  changed_when: false

- name: Wait for webhook configuration to be registered
  shell: kubectl get validatingwebhookconfigurations cert-manager-webhook
  register: webhook_config
  until: webhook_config.rc == 0
  retries: 30
  delay: 10
  changed_when: false
  ignore_errors: true

- name: Wait additional time for webhook to be fully operational
  pause:
    seconds: 60

- name: Create Let's Encrypt Staging ClusterIssuer
  shell: |
    kubectl apply -f - <<EOF
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: letsencrypt-staging
    spec:
      acme:
        server: https://acme-staging-v02.api.letsencrypt.org/directory
        email: {{ letsencrypt_email }}
        privateKeySecretRef:
          name: letsencrypt-staging-key
        solvers:
        - http01:
            gatewayHTTPRoute:
              parentRefs:
              - name: processcube-gateway
                kind: Gateway
                group: gateway.networking.k8s.io
    EOF
  changed_when: true

- name: Create Let's Encrypt Production ClusterIssuer
  shell: |
    kubectl apply -f - <<EOF
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: letsencrypt-production
    spec:
      acme:
        server: https://acme-v02.api.letsencrypt.org/directory
        email: {{ letsencrypt_email }}
        privateKeySecretRef:
          name: letsencrypt-production-key
        solvers:
        - http01:
            gatewayHTTPRoute:
              parentRefs:
              - name: processcube-gateway
                kind: Gateway
                group: gateway.networking.k8s.io
    EOF
  changed_when: true

- name: Display addons installation info
  debug:
    msg:
      - "Hetzner CSI Driver installed successfully"
      - "Traefik v3 Gateway Controller installed successfully"
      - "Gateway API CRDs (v1.2.0) installed successfully"
      - "LoadBalancer created automatically by CCM"
      - "cert-manager v1.20.2 installed successfully"
      - "Let's Encrypt ClusterIssuers configured:"
      - "  - letsencrypt-staging (for testing)"
      - "  - letsencrypt-production (for production use)"
      - ""
      - "LoadBalancer IP: {{ lb_ip.stdout }}"
      - "Gateway available at: http://{{ lb_ip.stdout }}"
      - ""
      - "To use TLS certificates, annotate your Gateway resource with:"
      - "  cert-manager.io/cluster-issuer: letsencrypt-staging"
      - "  or"
      - "  cert-manager.io/cluster-issuer: letsencrypt-production"
